<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Album Request Queue</title>
    <style>body{font-family:Arial,Helvetica,sans-serif;max-width:800px;margin:2rem auto;padding:0 1rem}textarea{width:100%;height:200px}</style>
  </head>
  <body>
    <h1>Request Albums</h1>
    <p>Paste one <em>Artist - Album</em> per line and submit.</p>
    <form method="post" action="/submit">
      <textarea name="requests" placeholder="Artist - Album\n..."> </textarea>
      <div style="margin-top:1rem"><button type="submit">Submit</button> <a href="/status">View status</a></div>
    </form>
  </body>
</html>
